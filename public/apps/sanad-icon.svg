<svg width="512" height="512" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#031b14"/>
    </linearGradient>
    <linearGradient id="emGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- iOS Squircle Frame -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="99" height="99" rx="21.5" fill="none" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.25"/>

  <!-- Financial Voucher Document with Folded Top-Right Corner -->
  <path d="M 23 15 
           L 63 15 
           L 77 29 
           L 77 82 
           A 7 7 0 0 1 70 89 
           L 23 89 
           A 7 7 0 0 1 16 82 
           L 16 22 
           A 7 7 0 0 1 23 15 Z" 
        fill="#ffffff" 
        fill-opacity="0.04" 
        stroke="#ffffff" 
        stroke-width="2.6" 
        stroke-linejoin="round" 
        stroke-opacity="0.35"/>

  <!-- Folded Corner Flap -->
  <path d="M 63 15 L 63 29 L 77 29" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="2.6" 
        stroke-linejoin="round" 
        stroke-opacity="0.35"/>

  <!-- Header Perforation / Document Code Line -->
  <line x1="24" y1="24" x2="42" y2="24" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.45"/>

  <!-- The Geometric "س" (Seen): 3 Crisp Teeth + Financial Growth Bowl -->
  <path d="M 70 41 
           C 70 47.5, 65 47.5, 64 47.5
           C 63 47.5, 59 47.5, 59 41
           C 59 47.5, 54 47.5, 53 47.5
           C 52 47.5, 48 47.5, 48 41
           C 48 55, 44 65, 36 65
           C 29 65, 25 58, 26 47" 
        fill="none" 
        stroke="url(#emGrad)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Bottom Voucher Settlement Lines -->
  <line x1="24" y1="76" x2="46" y2="76" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.45"/>
  <line x1="24" y1="81" x2="35" y2="81" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.25"/>
</svg>